<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shadow Runner 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth || 360;
    let height = window.innerHeight || 640;

    function resize() {
      width = canvas.width = window.innerWidth || document.documentElement.clientWidth || 360;
      height = canvas.height = window.innerHeight || document.documentElement.clientHeight || 640;
    }
    window.addEventListener("resize", resize);
    resize();

    // --- Audio Safe Wrapper ---
    const Audio = {
      ctx: null,
      init() {
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === "suspended") {
            this.ctx.resume();
          }
        } catch (e) {}
      },
      play(freqStart, freqEnd, duration, type = "sine") {
        try {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(Math.max(10, freqEnd), this.ctx.currentTime + duration);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      },
      jump() { this.play(200, 600, 0.15); },
      slide() { this.play(350, 100, 0.12); },
      score() { this.play(520, 880, 0.12); },
      crash() { this.play(180, 40, 0.35, "sawtooth"); }
    };

    // --- Perspective Constants ---
    const FOV = 300;
    const CAMERA_HEIGHT = 170;
    const HORIZON_RATIO = 0.45;

    // --- Game Variables ---
    let state = "menu"; // 'menu', 'play', 'dead'
    let distance = 0;
    let highDistance = 0;
    try {
      highDistance = parseInt(localStorage.getItem("sr_high_v3")) || 0;
    } catch (e) {}

    const START_SPEED = 7;
    const MAX_SPEED = 23;
    let currentSpeed = START_SPEED;

    const player = {
      lane: 0,
      targetLane: 0,
      laneX: 0,
      laneWidth: 110,
      y: 0,
      vy: 0,
      isJumping: false,
      isSliding: false,
      slideTimer: 0,
      runCycle: 0
    };

    let obstacles = [];
    let shards = [];

    // --- Controls ---
    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_DIST = 25;

    function handleStartInput() {
      Audio.init();
      if (state !== "play") {
        resetGame();
        state = "play";
        return true;
      }
      return false;
    }

    window.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      handleStartInput();
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (state !== "play" || !e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > SWIPE_DIST) {
          if (dx > 0 && player.targetLane < 1) player.targetLane++;
          else if (dx < 0 && player.targetLane > -1) player.targetLane--;
        }
      } else {
        if (Math.abs(dy) > SWIPE_DIST) {
          if (dy < 0 && !player.isJumping && !player.isSliding) {
            player.isJumping = true;
            player.vy = 16;
            Audio.jump();
          } else if (dy > 0 && !player.isSliding) {
            if (player.isJumping) player.vy = -18;
            player.isSliding = true;
            player.slideTimer = 34;
            Audio.slide();
          }
        }
      }
    }, { passive: true });

    window.addEventListener("mousedown", (e) => {
      handleStartInput();
    });

    window.addEventListener("keydown", (e) => {
      if (handleStartInput()) return;
      if ((e.code === "ArrowLeft" || e.code === "KeyA") && player.targetLane > -1) player.targetLane--;
      if ((e.code === "ArrowRight" || e.code === "KeyD") && player.targetLane < 1) player.targetLane++;
      if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") && !player.isJumping) {
        player.isJumping = true;
        player.vy = 16;
        Audio.jump();
      }
      if (e.code === "ArrowDown" || e.code === "KeyS") {
        if (player.isJumping) player.vy = -18;
        player.isSliding = true;
        player.slideTimer = 34;
        Audio.slide();
      }
    });

    function resetGame() {
      distance = 0;
      currentSpeed = START_SPEED;
      player.lane = 0;
      player.targetLane = 0;
      player.laneX = 0;
      player.y = 0;
      player.vy = 0;
      player.isJumping = false;
      player.isSliding = false;
      player.slideTimer = 0;
      player.runCycle = 0;

      obstacles = [];
      shards = [];

      for (let z = 900; z < 3800; z += 420) {
        spawnFeature(z);
      }
    }

    function spawnFeature(z) {
      const lane = Math.floor(Math.random() * 3) - 1;
      const roll = Math.random();

      if (roll < 0.45) {
        obstacles.push({ lane, z, type: "barrier", w: 75, h: 42, y: 0 });
      } else if (roll < 0.78) {
        obstacles.push({ lane, z, type: "gate", w: 75, h: 70, y: 35 });
      } else {
        shards.push({ lane, z, collected: false });
      }
    }

    function project(x, y, z) {
      const horizonY = height * HORIZON_RATIO;
      const validZ = Math.max(z, 0.1);
      const scale = FOV / validZ;
      return {
        x: width / 2 + x * scale,
        y: horizonY + (CAMERA_HEIGHT - y) * scale,
        scale: scale
      };
    }

    function update() {
      if (state !== "play") return;

      currentSpeed = Math.min(MAX_SPEED, START_SPEED + (distance * 0.0018));
      distance += currentSpeed;
      player.runCycle += currentSpeed * 0.035;

      const targetX = player.targetLane * player.laneWidth;
      player.laneX += (targetX - player.laneX) * 0.28;

      if (player.isJumping) {
        player.y += player.vy;
        player.vy -= 1.05;
        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }

      // Obstacle collision
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z -= currentSpeed;

        if (obs.z < 165 && obs.z > 75) {
          const inSameLane = Math.abs(player.laneX - obs.lane * player.laneWidth) < 40;
          if (inSameLane) {
            if (obs.type === "barrier" && player.y < obs.h - 5) {
              die();
              return;
            } else if (obs.type === "gate" && (!player.isSliding || player.y > 10)) {
              die();
              return;
            }
          }
        }
        if (obs.z < 20) obstacles.splice(i, 1);
      }

      // Energy pickups
      for (let i = shards.length - 1; i >= 0; i--) {
        const sh = shards[i];
        sh.z -= currentSpeed;

        if (!sh.collected && sh.z < 165 && sh.z > 75) {
          if (Math.abs(player.laneX - sh.lane * player.laneWidth) < 45) {
            sh.collected = true;
            distance += 350;
            Audio.score();
          }
        }
        if (sh.z < 20) shards.splice(i, 1);
      }

      // Spawning
      let furthestZ = 0;
      for (let i = 0; i < obstacles.length; i++) {
        if (obstacles[i].z > furthestZ) furthestZ = obstacles[i].z;
      }
      if (furthestZ < 3500) {
        const spacing = Math.max(340, 480 - currentSpeed * 4);
        spawnFeature(furthestZ + spacing + Math.random() * 80);
      }
    }

    function die() {
      Audio.crash();
      state = "dead";
      const total = Math.floor(distance / 10);
      if (total > highDistance) {
        highDistance = total;
        try { localStorage.setItem("sr_high_v3", highDistance); } catch (e) {}
      }
    }

    function drawRunner(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);

      const bob = (player.isJumping || player.isSliding) ? 0 : Math.sin(player.runCycle * 2) * 4 * scale;
      const swing = Math.sin(player.runCycle);

      if (player.isSliding) {
        ctx.fillStyle = "#00e5ff";
        ctx.fillRect(-12 * scale, -16 * scale, 24 * scale, 12 * scale);
        ctx.beginPath();
        ctx.arc(-16 * scale, -18 * scale, 5 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 4 * scale;
        ctx.beginPath();
        ctx.moveTo(-6 * scale, -8 * scale);
        ctx.lineTo(18 * scale, 0);
        ctx.stroke();
      } else if (player.isJumping) {
        ctx.fillStyle = "#00e5ff";
        ctx.beginPath();
        ctx.arc(0, -26 * scale, 12 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, -29 * scale, 5 * scale, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const hipY = (-22 + bob) * scale;
        const shoulderY = (-42 + bob) * scale;
        const headY = (-54 + bob) * scale;

        ctx.strokeStyle = "#00e5ff";
        ctx.fillStyle = "#00e5ff";
        ctx.lineWidth = 4 * scale;
        ctx.lineCap = "round";

        // Left Leg
        ctx.beginPath();
        ctx.moveTo(-6 * scale, hipY);
        ctx.lineTo(-8 * scale, hipY + 11 * scale + swing * 4 * scale);
        ctx.lineTo(-6 * scale + swing * 6 * scale, Math.min(0, hipY + 22 * scale + swing * 7 * scale));
        ctx.stroke();

        // Right Leg
        ctx.beginPath();
        ctx.moveTo(6 * scale, hipY);
        ctx.lineTo(8 * scale, hipY + 11 * scale - swing * 4 * scale);
        ctx.lineTo(6 * scale - swing * 6 * scale, Math.min(0, hipY + 22 * scale - swing * 7 * scale));
        ctx.stroke();

        // Body
        ctx.beginPath();
        ctx.moveTo(-10 * scale, shoulderY);
        ctx.lineTo(10 * scale, shoulderY);
        ctx.lineTo(6 * scale, hipY);
        ctx.lineTo(-6 * scale, hipY);
        ctx.closePath();
        ctx.fill();

        // Arms
        ctx.beginPath();
        ctx.moveTo(-10 * scale, shoulderY);
        ctx.lineTo(-14 * scale, shoulderY + 16 * scale - swing * 7 * scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(10 * scale, shoulderY);
        ctx.lineTo(14 * scale, shoulderY + 16 * scale + swing * 7 * scale);
        ctx.stroke();

        // Head
        ctx.beginPath();
        ctx.arc(0, headY, 6 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Core light
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(-1.5 * scale, shoulderY + 3 * scale, 3 * scale, 10 * scale);
      }

      ctx.restore();
    }

    function render() {
      // Re-check valid bounds
      if (width <= 0 || height <= 0) resize();

      ctx.clearRect(0, 0, width, height);

      const horizonY = height * HORIZON_RATIO;

      // Sky
      ctx.fillStyle = "#10091d";
      ctx.fillRect(0, 0, width, horizonY);

      // Sun
      ctx.fillStyle = "#ff0077";
      ctx.beginPath();
      ctx.arc(width / 2, horizonY, Math.min(65, width * 0.18), Math.PI, 0);
      ctx.fill();

      // Ground
      ctx.fillStyle = "#07080d";
      ctx.fillRect(0, horizonY, width, height - horizonY);

      // Rails
      ctx.lineWidth = 2;
      const rails = [-1.5, -0.5, 0.5, 1.5];
      for (let i = 0; i < rails.length; i++) {
        const r = rails[i];
        const pFar = project(r * player.laneWidth, 0, 3400);
        const pNear = project(r * player.laneWidth, 0, 70);
        ctx.strokeStyle = "rgba(0, 229, 255, 0.35)";
        ctx.beginPath();
        ctx.moveTo(pFar.x, pFar.y);
        ctx.lineTo(pNear.x, pNear.y);
        ctx.stroke();
      }

      // Horizontal crosslines
      const gridSpacing = 160;
      const offset = distance % gridSpacing;
      for (let z = 3400; z > 70; z -= gridSpacing) {
        const actualZ = z - offset;
        if (actualZ <= 70) continue;
        const pLeft = project(-1.5 * player.laneWidth, 0, actualZ);
        const pRight = project(1.5 * player.laneWidth, 0, actualZ);
        const alpha = Math.max(0.05, 1 - actualZ / 3000);
        ctx.strokeStyle = `rgba(138, 43, 226, ${alpha})`;
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.stroke();
      }

      // Sort Obstacles & Pickups
      const renderables = [];
      for (let i = 0; i < obstacles.length; i++) {
        renderables.push({ ...obstacles[i], rType: "obs" });
      }
      for (let i = 0; i < shards.length; i++) {
        if (!shards[i].collected) renderables.push({ ...shards[i], rType: "shard" });
      }
      renderables.sort((a, b) => b.z - a.z);

      for (let i = 0; i < renderables.length; i++) {
        const item = renderables[i];
        const xPos = item.lane * player.laneWidth;

        if (item.rType === "shard") {
          const p = project(xPos, 30 + Math.sin(distance * 0.05 + item.z) * 6, item.z);
          ctx.fillStyle = "#00ff99";
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(2, 14 * p.scale), 0, Math.PI * 2);
          ctx.fill();
        } else if (item.rType === "obs") {
          const p = project(xPos, item.y, item.z);
          const w = item.w * p.scale;
          const h = item.h * p.scale;

          if (item.type === "barrier") {
            ctx.fillStyle = "#ff1744";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.strokeStyle = "#ffffff";
            ctx.strokeRect(p.x - w / 2, p.y - h, w, h);
          } else {
            ctx.fillStyle = "rgba(255, 214, 0, 0.4)";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.strokeStyle = "#ffd600";
            ctx.lineWidth = Math.max(1, 2 * p.scale);
            ctx.strokeRect(p.x - w / 2, p.y - h, w, h);
          }
        }
      }

      // Draw Runner at Z=120
      const pRunner = project(player.laneX, player.y, 120);
      drawRunner(pRunner.x, pRunner.y, pRunner.scale);

      // UI
      if (state === "play") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "left";
        ctx.fillText(`${Math.floor(distance / 10)} M`, 20, 40);

        const kmh = Math.floor(currentSpeed * 8.5);
        ctx.font = "bold 12px monospace";
        ctx.fillStyle = currentSpeed < 12 ? "#00ff99" : currentSpeed < 18 ? "#ffd600" : "#ff1744";
        ctx.fillText(`${kmh} KM/H`, 20, 62);
      } else if (state === "menu") {
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("SHADOW RUNNER", width / 2, height / 2 - 70);

        ctx.font = "14px monospace";
        ctx.fillStyle = "#00e5ff";
        ctx.fillText("SWIPE LEFT / RIGHT", width / 2, height / 2 - 20);
        ctx.fillText("SWIPE UP TO JUMP", width / 2, height / 2 + 10);
        ctx.fillText("SWIPE DOWN TO SLIDE", width / 2, height / 2 + 40);

        ctx.fillStyle = "#ff0077";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("TAP SCREEN TO PLAY", width / 2, height / 2 + 95);
      } else if (state === "dead") {
        ctx.fillStyle = "#ff1744";
        ctx.textAlign = "center";
        ctx.font = "bold 32px sans-serif";
        ctx.fillText("CRASHED", width / 2, height / 2 - 55);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px monospace";
        ctx.fillText(`DISTANCE: ${Math.floor(distance / 10)} M`, width / 2, height / 2 - 10);
        ctx.fillText(`BEST: ${highDistance} M`, width / 2, height / 2 + 20);

        ctx.fillStyle = "#00e5ff";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("TAP TO RETRY", width / 2, height / 2 + 75);
      }

      update();
      requestAnimationFrame(render);
    }

    // Start immediately
    resetGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
