<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Shadow Runner 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #050508;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // --- Web Audio SFX ---
    const Audio = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
      },
      jump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(650, this.ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.18);
      },
      slide() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      },
      crash() {
        if (!this.ctx) return;
        const dur = 0.4;
        const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * dur, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < buf.length; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        src.connect(gain);
        gain.connect(this.ctx.destination);
        src.start();
      },
      score() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.07);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
    };

    // --- Perspective Constants ---
    const FOV = 280;
    const CAMERA_HEIGHT = 160;
    const HORIZON_RATIO = 0.42;

    // --- Game State ---
    let state = "menu"; // 'menu', 'play', 'dead'
    let distance = 0;
    let highDistance = localStorage.getItem("sr_high") || 0;
    let baseSpeed = 16;
    let speed = baseSpeed;

    // Player: lanes are -1 (Left), 0 (Center), 1 (Right)
    const player = {
      lane: 0,
      targetLane: 0,
      laneX: 0,
      laneWidth: 130,
      y: 0,
      vy: 0,
      isJumping: false,
      isSliding: false,
      slideTimer: 0,
      actionHeight: 50
    };

    let segments = [];
    let obstacles = [];
    let energyShards = [];

    // --- Touch Swipe Detector ---
    let touchStartX = 0;
    let touchStartY = 0;
    const SWIPE_THRESHOLD = 30;

    window.addEventListener("touchstart", (e) => {
      Audio.init();
      if (state !== "play") {
        resetGame();
        state = "play";
        return;
      }
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    window.addEventListener("touchend", (e) => {
      if (state !== "play") return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > SWIPE_THRESHOLD) {
          if (dx > 0 && player.targetLane < 1) player.targetLane++;
          else if (dx < 0 && player.targetLane > -1) player.targetLane--;
        }
      } else {
        if (Math.abs(dy) > SWIPE_THRESHOLD) {
          if (dy < 0 && !player.isJumping && !player.isSliding) {
            // Jump
            player.isJumping = true;
            player.vy = 16;
            Audio.jump();
          } else if (dy > 0 && !player.isSliding) {
            // Slide / Fast drop
            if (player.isJumping) player.vy = -18;
            player.isSliding = true;
            player.slideTimer = 35;
            Audio.slide();
          }
        }
      }
    });

    // Keyboard support for desktop testing
    window.addEventListener("keydown", (e) => {
      Audio.init();
      if (state !== "play") {
        resetGame();
        state = "play";
        return;
      }
      if ((e.code === "ArrowLeft" || e.code === "KeyA") && player.targetLane > -1) player.targetLane--;
      if ((e.code === "ArrowRight" || e.code === "KeyD") && player.targetLane < 1) player.targetLane++;
      if ((e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") && !player.isJumping) {
        player.isJumping = true;
        player.vy = 16;
        Audio.jump();
      }
      if (e.code === "ArrowDown" || e.code === "KeyS") {
        if (player.isJumping) player.vy = -18;
        player.isSliding = true;
        player.slideTimer = 35;
        Audio.slide();
      }
    });

    function resetGame() {
      distance = 0;
      speed = baseSpeed;
      player.lane = 0;
      player.targetLane = 0;
      player.laneX = 0;
      player.y = 0;
      player.vy = 0;
      player.isJumping = false;
      player.isSliding = false;
      player.slideTimer = 0;

      obstacles = [];
      energyShards = [];

      // Pre-seed track
      for (let z = 600; z < 4000; z += 380) {
        spawnTrackFeature(z);
      }
    }

    function spawnTrackFeature(z) {
      const lane = Math.floor(Math.random() * 3) - 1; // -1, 0, or 1
      const roll = Math.random();

      if (roll < 0.45) {
        // Barrier (Must JUMP over)
        obstacles.push({
          lane,
          z,
          type: "barrier",
          w: 80,
          h: 40,
          y: 0
        });
      } else if (roll < 0.75) {
        // High Gate (Must SLIDE under)
        obstacles.push({
          lane,
          z,
          type: "gate",
          w: 80,
          h: 70,
          y: 35
        });
      } else {
        // Energy battery
        energyShards.push({
          lane,
          z,
          collected: false
        });
      }
    }

    // 3D Projection formula
    function project(x, y, z) {
      const horizonY = height * HORIZON_RATIO;
      if (z <= 0) z = 0.1;
      const scale = FOV / z;
      return {
        x: width / 2 + x * scale,
        y: horizonY + (CAMERA_HEIGHT - y) * scale,
        scale: scale
      };
    }

    // --- UPDATE LOOP ---
    function update() {
      if (state !== "play") return;

      distance += speed;
      speed = baseSpeed + Math.min(distance * 0.003, 16);

      // Smooth horizontal lane transition
      const targetX = player.targetLane * player.laneWidth;
      player.laneX += (targetX - player.laneX) * 0.28;

      // Vertical jumping physics
      if (player.isJumping) {
        player.y += player.vy;
        player.vy -= 1.1; // gravity
        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      // Slide countdown
      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }

      // Update Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z -= speed;

        // Collision Window (near camera z=120)
        if (obs.z < 180 && obs.z > 60) {
          const inSameLane = Math.abs(player.laneX - obs.lane * player.laneWidth) < 45;
          if (inSameLane) {
            if (obs.type === "barrier") {
              // Hit if not jumped high enough
              if (player.y < obs.h - 5) {
                die();
                return;
              }
            } else if (obs.type === "gate") {
              // Hit if not sliding
              if (!player.isSliding || player.y > 10) {
                die();
                return;
              }
            }
          }
        }

        if (obs.z < 20) {
          obstacles.splice(i, 1);
        }
      }

      // Update Collectibles
      for (let i = energyShards.length - 1; i >= 0; i--) {
        const shard = energyShards[i];
        shard.z -= speed;

        if (!shard.collected && shard.z < 180 && shard.z > 60) {
          const inSameLane = Math.abs(player.laneX - shard.lane * player.laneWidth) < 50;
          if (inSameLane) {
            shard.collected = true;
            distance += 400; // Bonus meters
            Audio.score();
          }
        }

        if (shard.z < 20) {
          energyShards.splice(i, 1);
        }
      }

      // Keep spawning obstacles ahead
      const furthestZ = obstacles.reduce((max, o) => Math.max(max, o.z), 0);
      if (furthestZ < 3500) {
        spawnTrackFeature(furthestZ + 360 + Math.random() * 120);
      }
    }

    function die() {
      Audio.crash();
      state = "dead";
      const totalScore = Math.floor(distance / 10);
      if (totalScore > highDistance) {
        highDistance = totalScore;
        localStorage.setItem("sr_high", highDistance);
      }
    }

    // --- RENDER PIPELINE ---
    function render() {
      ctx.clearRect(0, 0, width, height);

      const horizonY = height * HORIZON_RATIO;

      // Sky gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      skyGrad.addColorStop(0, "#080614");
      skyGrad.addColorStop(1, "#230b3b");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, horizonY);

      // Neon horizon sun
      ctx.save();
      ctx.beginPath();
      ctx.arc(width / 2, horizonY, 70, Math.PI, 0);
      const sunGrad = ctx.createLinearGradient(0, horizonY - 70, 0, horizonY);
      sunGrad.addColorStop(0, "#ff0077");
      sunGrad.addColorStop(1, "#ffaa00");
      ctx.fillStyle = sunGrad;
      ctx.shadowColor = "#ff0055";
      ctx.shadowBlur = 30;
      ctx.fill();
      ctx.restore();

      // Ground plane
      ctx.fillStyle = "#090b10";
      ctx.fillRect(0, horizonY, width, height - horizonY);

      // Perspective Track Lines (3 lanes = 4 rails)
      ctx.lineWidth = 2;
      const railOffsets = [-1.5, -0.5, 0.5, 1.5];
      for (const r of railOffsets) {
        const pFar = project(r * player.laneWidth, 0, 3500);
        const pNear = project(r * player.laneWidth, 0, 80);
        ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
        ctx.beginPath();
        ctx.moveTo(pFar.x, pFar.y);
        ctx.lineTo(pNear.x, pNear.y);
        ctx.stroke();
      }

      // Moving Ground Grid Crosslines
      const gridSpacing = 160;
      const offset = distance % gridSpacing;
      for (let z = 3500; z > 80; z -= gridSpacing) {
        const actualZ = z - offset;
        if (actualZ <= 80) continue;
        const pLeft = project(-1.5 * player.laneWidth, 0, actualZ);
        const pRight = project(1.5 * player.laneWidth, 0, actualZ);
        ctx.strokeStyle = `rgba(140, 0, 255, ${Math.max(0, 1 - actualZ / 3000)})`;
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.stroke();
      }

      // Draw Collectibles & Obstacles from back to front (Painter's algorithm)
      const renderables = [
        ...obstacles.map(o => ({ ...o, rType: "obs" })),
        ...energyShards.filter(s => !s.collected).map(s => ({ ...s, rType: "shard" }))
      ].sort((a, b) => b.z - a.z);

      for (const item of renderables) {
        const xPos = item.lane * player.laneWidth;

        if (item.rType === "shard") {
          const p = project(xPos, 35 + Math.sin(distance * 0.05 + item.z) * 10, item.z);
          const size = 18 * p.scale;
          ctx.save();
          ctx.fillStyle = "#00ffaa";
          ctx.shadowColor = "#00ffaa";
          ctx.shadowBlur = 12 * p.scale;
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (item.rType === "obs") {
          const p = project(xPos, item.y, item.z);
          const w = item.w * p.scale;
          const h = item.h * p.scale;

          ctx.save();
          if (item.type === "barrier") {
            // Jump wall
            ctx.fillStyle = "#ff2255";
            ctx.shadowColor = "#ff0055";
            ctx.shadowBlur = 10 * p.scale;
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.strokeStyle = "#ffffff";
            ctx.strokeRect(p.x - w / 2, p.y - h, w, h);
          } else {
            // High Laser Gate
            ctx.fillStyle = "rgba(255, 200, 0, 0.35)";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.strokeStyle = "#ffcc00";
            ctx.lineWidth = 3 * p.scale;
            ctx.strokeRect(p.x - w / 2, p.y - h, w, h);
          }
          ctx.restore();
        }
      }

      // Draw Player Runner Cyber-Pod
      const pPlayer = project(player.laneX, player.y, 110);
      ctx.save();
      ctx.translate(pPlayer.x, pPlayer.y);

      if (player.isSliding) {
        // Flattened slide form
        ctx.fillStyle = "#00f0ff";
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 15;
        ctx.fillRect(-26, -12, 52, 12);
      } else {
        // Standing athletic speed pod
        ctx.fillStyle = "#00f0ff";
        ctx.shadowColor = "#00f0ff";
        ctx.shadowBlur = 20;

        // Main chassis
        ctx.beginPath();
        ctx.moveTo(0, -42);
        ctx.lineTo(20, 0);
        ctx.lineTo(0, -6);
        ctx.lineTo(-20, 0);
        ctx.closePath();
        ctx.fill();

        // Thruster glow
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(0, -6, 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // UI & Instructions
      if (state === "play") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 22px monospace";
        ctx.textAlign = "left";
        ctx.fillText(`${Math.floor(distance / 10)} M`, 24, 45);

        ctx.font = "12px sans-serif";
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        ctx.fillText(`SPEED: ${Math.floor(speed * 10)} KM/H`, 24, 70);
      } else if (state === "menu") {
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "900 32px sans-serif";
        ctx.fillText("SHADOW RUNNER", width / 2, height / 2 - 80);

        ctx.font = "bold 15px monospace";
        ctx.fillStyle = "#00f0ff";
        ctx.fillText("SWIPE LEFT / RIGHT : SWITCH LANES", width / 2, height / 2 - 20);
        ctx.fillText("SWIPE UP           : JUMP BARRIER", width / 2, height / 2 + 10);
        ctx.fillText("SWIPE DOWN         : SLIDE UNDER GATE", width / 2, height / 2 + 40);

        ctx.fillStyle = "#ff0077";
        ctx.font = "900 18px sans-serif";
        ctx.fillText("TAP SCREEN TO RUN", width / 2, height / 2 + 100);
      } else if (state === "dead") {
        ctx.fillStyle = "#ff1744";
        ctx.textAlign = "center";
        ctx.font = "900 36px sans-serif";
        ctx.fillText("CRASHED", width / 2, height / 2 - 60);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px monospace";
        ctx.fillText(`DISTANCE: ${Math.floor(distance / 10)} M`, width / 2, height / 2 - 10);
        ctx.fillText(`RECORD: ${highDistance} M`, width / 2, height / 2 + 25);

        ctx.fillStyle = "#00f0ff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("TAP TO TRY AGAIN", width / 2, height / 2 + 85);
      }

      update();
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
