<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Temple Escape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120904;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    /* Optional On-Screen Mobile Button Bar */
    .controls-overlay {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(30, 20, 15, 0.65);
      border: 2px solid rgba(255, 180, 50, 0.6);
      color: #ffc44d;
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .btn:active {
      background: rgba(255, 180, 50, 0.4);
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="controls-overlay">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btnJump">▲</div>
      <div class="btn" id="btnSlide">▼</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = window.innerWidth || 360;
    let height = window.innerHeight || 640;

    function resize() {
      width = canvas.width = window.innerWidth || 360;
      height = canvas.height = window.innerHeight || 640;
    }
    window.addEventListener("resize", resize);
    resize();

    // --- Lightweight Procedural Audio ---
    const Audio = {
      ctx: null,
      init() {
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        } catch (e) {}
      },
      beep(fStart, fEnd, dur, type = "sine", vol = 0.12) {
        try {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(fStart, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), this.ctx.currentTime + dur);
          gain.gain.setValueAtTime(vol, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      },
      jump() { this.beep(240, 550, 0.18, "sine", 0.15); },
      slide() { this.beep(300, 120, 0.15, "triangle", 0.12); },
      coin() { this.beep(650, 1100, 0.1, "sine", 0.15); },
      crash() { this.beep(160, 40, 0.4, "sawtooth", 0.25); }
    };

    // --- Elevated Temple Run Perspective Constants ---
    const FOV = 320;
    const CAMERA_HEIGHT = 280; // High angle looking down
    const HORIZON_RATIO = 0.32; // Low horizon gives long forward visibility

    // --- Game Variables (Simplified & Forgiving) ---
    let state = "menu"; // 'menu', 'play', 'dead'
    let score = 0;
    let coins = 0;
    let highScore = 0;
    try { highScore = parseInt(localStorage.getItem("tr_high")) || 0; } catch (e) {}

    // Gentle progressive speed
    const START_SPEED = 5.2; // Slow relaxed jog
    const MAX_SPEED = 14.5;  // Easy-to-react top speed
    let currentSpeed = START_SPEED;

    // Player (Temple Explorer)
    const player = {
      lane: 0,        // -1: Left, 0: Mid, 1: Right
      targetLane: 0,
      laneX: 0,
      laneWidth: 95,
      y: 0,
      vy: 0,
      isJumping: false,
      isSliding: false,
      slideTimer: 0,
      runCycle: 0
    };

    let obstacles = [];
    let coinPickups = [];

    // --- Input Actions ---
    function doLeft() {
      if (player.targetLane > -1) player.targetLane--;
    }
    function doRight() {
      if (player.targetLane < 1) player.targetLane++;
    }
    function doJump() {
      if (!player.isJumping && !player.isSliding) {
        player.isJumping = true;
        player.vy = 15; // floaty, forgiving jump
        Audio.jump();
      }
    }
    function doSlide() {
      if (!player.isSliding) {
        if (player.isJumping) player.vy = -16;
        player.isSliding = true;
        player.slideTimer = 38;
        Audio.slide();
      }
    }

    function handleStart() {
      Audio.init();
      if (state !== "play") {
        resetGame();
        state = "play";
        return true;
      }
      return false;
    }

    // Button controls
    document.getElementById("btnLeft").addEventListener("pointerdown", (e) => { e.stopPropagation(); handleStart() || doLeft(); });
    document.getElementById("btnRight").addEventListener("pointerdown", (e) => { e.stopPropagation(); handleStart() || doRight(); });
    document.getElementById("btnJump").addEventListener("pointerdown", (e) => { e.stopPropagation(); handleStart() || doJump(); });
    document.getElementById("btnSlide").addEventListener("pointerdown", (e) => { e.stopPropagation(); handleStart() || doSlide(); });

    // Swipe controls
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
      handleStart();
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (state !== "play" || !e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 25) {
          if (dx > 0) doRight();
          else doLeft();
        }
      } else {
        if (Math.abs(dy) > 25) {
          if (dy < 0) doJump();
          else doSlide();
        }
      }
    }, { passive: true });

    // Keyboard support
    window.addEventListener("keydown", (e) => {
      if (handleStart()) return;
      if (e.code === "ArrowLeft" || e.code === "KeyA") doLeft();
      if (e.code === "ArrowRight" || e.code === "KeyD") doRight();
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") doJump();
      if (e.code === "ArrowDown" || e.code === "KeyS") doSlide();
    });

    window.addEventListener("mousedown", () => handleStart());

    function resetGame() {
      score = 0;
      coins = 0;
      currentSpeed = START_SPEED;
      player.lane = 0;
      player.targetLane = 0;
      player.laneX = 0;
      player.y = 0;
      player.vy = 0;
      player.isJumping = false;
      player.isSliding = false;
      player.slideTimer = 0;
      player.runCycle = 0;

      obstacles = [];
      coinPickups = [];

      // Generously spaced initial track (lots of reaction time)
      for (let z = 1200; z < 4200; z += 550) {
        spawnFeature(z);
      }
    }

    function spawnFeature(z) {
      const lane = Math.floor(Math.random() * 3) - 1;
      const roll = Math.random();

      if (roll < 0.45) {
        // Ancient Broken Log / Tree (JUMP)
        obstacles.push({ lane, z, type: "log", w: 70, h: 36, y: 0 });
      } else if (roll < 0.75) {
        // Fire Trap Archway (SLIDE)
        obstacles.push({ lane, z, type: "fire", w: 70, h: 65, y: 32 });
      } else {
        // Trail of 3 gold coins
        for (let k = 0; k < 3; k++) {
          coinPickups.push({ lane, z: z + k * 80, collected: false });
        }
      }
    }

    // 3D Perspective Projection
    function project(x, y, z) {
      const horizonY = height * HORIZON_RATIO;
      const validZ = Math.max(z, 0.1);
      const scale = FOV / validZ;
      return {
        x: width / 2 + x * scale,
        y: horizonY + (CAMERA_HEIGHT - y) * scale,
        scale: scale
      };
    }

    // --- GAME ENGINE LOOP ---
    function update() {
      if (state !== "play") return;

      // Gentle speed progression
      currentSpeed = Math.min(MAX_SPEED, START_SPEED + (score * 0.0012));
      score += currentSpeed;
      player.runCycle += currentSpeed * 0.04;

      // Smooth horizontal shift with subtle banking
      const targetX = player.targetLane * player.laneWidth;
      player.laneX += (targetX - player.laneX) * 0.22;

      // Jump arc
      if (player.isJumping) {
        player.y += player.vy;
        player.vy -= 0.85; // Lower gravity = floatier, comfortable jumps
        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }

      // Check Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.z -= currentSpeed;

        // Lenient collision box
        if (obs.z < 210 && obs.z > 110) {
          const sameLane = Math.abs(player.laneX - obs.lane * player.laneWidth) < 36;
          if (sameLane) {
            if (obs.type === "log" && player.y < obs.h - 8) {
              die();
              return;
            } else if (obs.type === "fire" && (!player.isSliding || player.y > 8)) {
              die();
              return;
            }
          }
        }
        if (obs.z < 20) obstacles.splice(i, 1);
      }

      // Check Coins
      for (let i = coinPickups.length - 1; i >= 0; i--) {
        const c = coinPickups[i];
        c.z -= currentSpeed;

        if (!c.collected && c.z < 210 && c.z > 100) {
          if (Math.abs(player.laneX - c.lane * player.laneWidth) < 42) {
            c.collected = true;
            coins += 1;
            score += 60;
            Audio.coin();
          }
        }
        if (c.z < 20) coinPickups.splice(i, 1);
      }

      // Spawning new features ahead with lots of breathing room
      let furthestZ = 0;
      for (let i = 0; i < obstacles.length; i++) {
        if (obstacles[i].z > furthestZ) furthestZ = obstacles[i].z;
      }
      if (furthestZ < 3600) {
        const spacing = Math.max(480, 650 - currentSpeed * 6);
        spawnFeature(furthestZ + spacing + Math.random() * 100);
      }
    }

    function die() {
      Audio.crash();
      state = "dead";
      const total = Math.floor(score / 10);
      if (total > highScore) {
        highScore = total;
        try { localStorage.setItem("tr_high", highScore); } catch (e) {}
      }
    }

    // --- DRAW TEMPLE RUN EXPLORER (High visibility & banking) ---
    function drawExplorer(x, y, scale) {
      ctx.save();
      ctx.translate(x, y);

      // Subtle dynamic body tilt when moving across lanes
      const laneDelta = (player.targetLane * player.laneWidth - player.laneX);
      const bankAngle = Math.max(-0.25, Math.min(0.25, laneDelta * 0.015));
      ctx.rotate(bankAngle);

      const bob = (player.isJumping || player.isSliding) ? 0 : Math.sin(player.runCycle * 2) * 4 * scale;
      const legSwing = Math.sin(player.runCycle);

      // Drop shadow underneath player on the temple stones
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.beginPath();
      ctx.ellipse(0, 2 * scale, 16 * scale, 7 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      if (player.isSliding) {
        // --- Low Dust Slide ---
        ctx.fillStyle = "#8a572a"; // Leather jacket
        ctx.fillRect(-12 * scale, -18 * scale, 24 * scale, 12 * scale);

        // Fedora hat
        ctx.fillStyle = "#4a2c11";
        ctx.fillRect(-18 * scale, -24 * scale, 14 * scale, 6 * scale);

        // Legs sliding forward
        ctx.strokeStyle = "#d4b27b"; // Khaki pants
        ctx.lineWidth = 5 * scale;
        ctx.beginPath();
        ctx.moveTo(-6 * scale, -8 * scale);
        ctx.lineTo(20 * scale, 0);
        ctx.stroke();

        // Temple dust puff
        ctx.fillStyle = "rgba(180, 140, 90, 0.5)";
        ctx.beginPath();
        ctx.arc(22 * scale, 0, 6 * scale, 0, Math.PI * 2);
        ctx.fill();
      } else if (player.isJumping) {
        // --- Elevated Leap ---
        // Torso
        ctx.fillStyle = "#8a572a";
        ctx.beginPath();
        ctx.arc(0, -28 * scale, 13 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Fedora
        ctx.fillStyle = "#4a2c11";
        ctx.fillRect(-14 * scale, -44 * scale, 28 * scale, 5 * scale);
        ctx.fillRect(-9 * scale, -52 * scale, 18 * scale, 8 * scale);

        // Tucked legs
        ctx.strokeStyle = "#d4b27b";
        ctx.lineWidth = 5 * scale;
        ctx.beginPath();
        ctx.arc(0, -18 * scale, 9 * scale, 0, Math.PI);
        ctx.stroke();
      } else {
        // --- Running Explorer (Clear silhouette with Fedora & Backpack) ---
        const hipY = (-24 + bob) * scale;
        const shoulderY = (-46 + bob) * scale;
        const headY = (-58 + bob) * scale;

        // Khaki Legs
        ctx.strokeStyle = "#d4b27b";
        ctx.lineWidth = 5 * scale;
        ctx.lineCap = "round";

        // Left Leg
        ctx.beginPath();
        ctx.moveTo(-6 * scale, hipY);
        ctx.lineTo(-8 * scale, hipY + 12 * scale + legSwing * 5 * scale);
        ctx.lineTo(-6 * scale + legSwing * 7 * scale, Math.min(0, hipY + 24 * scale + legSwing * 8 * scale));
        ctx.stroke();

        // Right Leg
        ctx.beginPath();
        ctx.moveTo(6 * scale, hipY);
        ctx.lineTo(8 * scale, hipY + 12 * scale - legSwing * 5 * scale);
        ctx.lineTo(6 * scale - legSwing * 7 * scale, Math.min(0, hipY + 24 * scale - legSwing * 8 * scale));
        ctx.stroke();

        // Leather Torso
        ctx.fillStyle = "#8a572a";
        ctx.beginPath();
        ctx.moveTo(-11 * scale, shoulderY);
        ctx.lineTo(11 * scale, shoulderY);
        ctx.lineTo(7 * scale, hipY);
        ctx.lineTo(-7 * scale, hipY);
        ctx.closePath();
        ctx.fill();

        // Adventurer Backpack
        ctx.fillStyle = "#5c3818";
        ctx.fillRect(-7 * scale, shoulderY + 4 * scale, 14 * scale, 12 * scale);

        // Arms swinging
        ctx.strokeStyle = "#8a572a";
        ctx.beginPath();
        ctx.moveTo(-11 * scale, shoulderY);
        ctx.lineTo(-15 * scale, shoulderY + 15 * scale - legSwing * 7 * scale);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(11 * scale, shoulderY);
        ctx.lineTo(15 * scale, shoulderY + 15 * scale + legSwing * 7 * scale);
        ctx.stroke();

        // Head
        ctx.fillStyle = "#e6b98d";
        ctx.beginPath();
        ctx.arc(0, headY, 6.5 * scale, 0, Math.PI * 2);
        ctx.fill();

        // Fedora (Brown Adventurer Hat)
        ctx.fillStyle = "#4a2c11";
        ctx.fillRect(-15 * scale, headY - 3 * scale, 30 * scale, 4 * scale); // Brim
        ctx.fillRect(-9 * scale, headY - 11 * scale, 18 * scale, 8 * scale);  // Crown
      }

      ctx.restore();
    }

    // --- RENDER PIPELINE ---
    function render() {
      if (width <= 0 || height <= 0) resize();

      ctx.clearRect(0, 0, width, height);

      const horizonY = height * HORIZON_RATIO;

      // Temple Jungle Canopy & Sunset
      const bgGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
      bgGrad.addColorStop(0, "#0e180e");
      bgGrad.addColorStop(0.7, "#28170c");
      bgGrad.addColorStop(1, "#522b10");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, horizonY);

      // Distant Temple Silhouette Sun
      ctx.fillStyle = "#ff8c1a";
      ctx.beginPath();
      ctx.arc(width / 2, horizonY, 55, Math.PI, 0);
      ctx.fill();

      // Deep Ruin Abyss (Ground sides)
      ctx.fillStyle = "#120804";
      ctx.fillRect(0, horizonY, width, height - horizonY);

      // Stone Bridge Pathway (Temple Floor)
      const pTrackFarL = project(-1.6 * player.laneWidth, 0, 3600);
      const pTrackFarR = project(1.6 * player.laneWidth, 0, 3600);
      const pTrackNearL = project(-1.6 * player.laneWidth, 0, 80);
      const pTrackNearR = project(1.6 * player.laneWidth, 0, 80);

      // Ancient Stone Floor Fill
      ctx.fillStyle = "#2d231b";
      ctx.beginPath();
      ctx.moveTo(pTrackFarL.x, pTrackFarL.y);
      ctx.lineTo(pTrackFarR.x, pTrackFarR.y);
      ctx.lineTo(pTrackNearR.x, pTrackNearR.y);
      ctx.lineTo(pTrackNearL.x, pTrackNearL.y);
      ctx.closePath();
      ctx.fill();

      // Stone Carved Edge Borders (Left & Right parapets)
      ctx.strokeStyle = "#825d3b";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(pTrackFarL.x, pTrackFarL.y);
      ctx.lineTo(pTrackNearL.x, pTrackNearL.y);
      ctx.moveTo(pTrackFarR.x, pTrackFarR.y);
      ctx.lineTo(pTrackNearR.x, pTrackNearR.y);
      ctx.stroke();

      // Stone Tile Seams
      const tileSpacing = 140;
      const offset = score % tileSpacing;
      for (let z = 3600; z > 80; z -= tileSpacing) {
        const actualZ = z - offset;
        if (actualZ <= 80) continue;
        const pLeft = project(-1.6 * player.laneWidth, 0, actualZ);
        const pRight = project(1.6 * player.laneWidth, 0, actualZ);
        const alpha = Math.max(0.1, 1 - actualZ / 3000);
        ctx.strokeStyle = `rgba(18, 12, 8, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(pLeft.x, pLeft.y);
        ctx.lineTo(pRight.x, pRight.y);
        ctx.stroke();
      }

      // Sort Obstacles & Coins back to front
      const items = [
        ...obstacles.map(o => ({ ...o, rType: "obs" })),
        ...coinPickups.filter(c => !c.collected).map(c => ({ ...c, rType: "coin" }))
      ].sort((a, b) => b.z - a.z);

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const xPos = item.lane * player.laneWidth;

        if (item.rType === "coin") {
          const p = project(xPos, 28 + Math.sin(score * 0.05 + item.z) * 6, item.z);
          // Spinning gold coin
          const spinScale = Math.abs(Math.cos(score * 0.05 + item.z * 0.02));
          ctx.fillStyle = "#ffcc00";
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, Math.max(2, 13 * p.scale * spinScale), Math.max(2, 13 * p.scale), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#ffe680";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else if (item.rType === "obs") {
          const p = project(xPos, item.y, item.z);
          const w = item.w * p.scale;
          const h = item.h * p.scale;

          if (item.type === "log") {
            // Broken Tree Trunk Barrier (JUMP OVER)
            ctx.fillStyle = "#4a2e18";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.fillStyle = "#331e0f";
            ctx.fillRect(p.x - w / 2 + 4, p.y - h + 4, w - 8, h - 8);
            // Red warning band
            ctx.fillStyle = "#cc3300";
            ctx.fillRect(p.x - w / 2, p.y - h - 3, w, 4);
          } else {
            // Temple Stone Arch with Flaming Fire (SLIDE UNDER)
            ctx.fillStyle = "#3d2b1f";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h * 0.35); // top lintel
            // Pillars
            ctx.fillRect(p.x - w / 2, p.y - h, 8 * p.scale, h);
            ctx.fillRect(p.x + w / 2 - 8 * p.scale, p.y - h, 8 * p.scale, h);
            // Fire flames under arch
            ctx.fillStyle = "#ff6600";
            ctx.fillRect(p.x - w / 2 + 6, p.y - h + h * 0.3, w - 12, 8
