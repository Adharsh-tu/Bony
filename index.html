<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Temple Escape</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #180d05;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }
    .controls-overlay {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
      z-index: 10;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }
    .btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(35, 20, 10, 0.75);
      border: 2px solid #ffb03b;
      color: #ffb03b;
      font-weight: 900;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .btn:active {
      background: rgba(255, 176, 59, 0.4);
      transform: scale(0.92);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="controls-overlay">
    <div class="btn-group">
      <div class="btn" id="btnLeft">◀</div>
      <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn-group">
      <div class="btn" id="btnJump">▲</div>
      <div class="btn" id="btnSlide">▼</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width = 360;
    let height = 640;

    function resize() {
      width = window.innerWidth || document.documentElement.clientWidth || 360;
      height = window.innerHeight || document.documentElement.clientHeight || 640;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 100));
    resize();

    // Audio Engine (Passive/Non-blocking)
    const AudioEngine = {
      ctx: null,
      init() {
        try {
          if (!this.ctx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) this.ctx = new AC();
          }
          if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
        } catch (e) {}
      },
      play(freq, dur) {
        try {
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + dur);
        } catch (e) {}
      }
    };

    // Game State
    let state = "menu"; // 'menu', 'play', 'dead'
    let score = 0;
    let coins = 0;
    let highScore = 0;
    try { highScore = parseInt(localStorage.getItem("te_high")) || 0; } catch (e) {}

    const START_SPEED = 5;
    const MAX_SPEED = 14;
    let speed = START_SPEED;

    // Player Explorer
    const player = {
      lane: 0, // -1: Left, 0: Mid, 1: Right
      targetLane: 0,
      x: 0,
      y: 0,
      vy: 0,
      isJumping: false,
      isSliding: false,
      slideTimer: 0,
      step: 0
    };

    let obstacles = [];
    let coinList = [];

    function moveLeft() {
      if (player.targetLane > -1) player.targetLane--;
    }
    function moveRight() {
      if (player.targetLane < 1) player.targetLane++;
    }
    function jump() {
      if (!player.isJumping && !player.isSliding) {
        player.isJumping = true;
        player.vy = 14;
        AudioEngine.play(400, 0.15);
      }
    }
    function slide() {
      if (!player.isSliding) {
        if (player.isJumping) player.vy = -16;
        player.isSliding = true;
        player.slideTimer = 36;
        AudioEngine.play(250, 0.15);
      }
    }

    function triggerStart() {
      AudioEngine.init();
      if (state !== "play") {
        resetGame();
        state = "play";
        return true;
      }
      return false;
    }

    // Button event wiring
    const btnL = document.getElementById("btnLeft");
    const btnR = document.getElementById("btnRight");
    const btnJ = document.getElementById("btnJump");
    const btnS = document.getElementById("btnSlide");

    btnL.addEventListener("touchstart", (e) => { e.preventDefault(); triggerStart() || moveLeft(); });
    btnR.addEventListener("touchstart", (e) => { e.preventDefault(); triggerStart() || moveRight(); });
    btnJ.addEventListener("touchstart", (e) => { e.preventDefault(); triggerStart() || jump(); });
    btnS.addEventListener("touchstart", (e) => { e.preventDefault(); triggerStart() || slide(); });

    btnL.addEventListener("mousedown", (e) => { e.preventDefault(); triggerStart() || moveLeft(); });
    btnR.addEventListener("mousedown", (e) => { e.preventDefault(); triggerStart() || moveRight(); });
    btnJ.addEventListener("mousedown", (e) => { e.preventDefault(); triggerStart() || jump(); });
    btnS.addEventListener("mousedown", (e) => { e.preventDefault(); triggerStart() || slide(); });

    // Swipes
    let tX = 0, tY = 0;
    window.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      tX = t.clientX;
      tY = t.clientY;
      triggerStart();
    }, { passive: true });

    window.addEventListener("touchend", (e) => {
      if (state !== "play" || !e.changedTouches.length) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - tX;
      const dy = t.clientY - tY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) {
          if (dx > 0) moveRight();
          else moveLeft();
        }
      } else {
        if (Math.abs(dy) > 30) {
          if (dy < 0) jump();
          else slide();
        }
      }
    }, { passive: true });

    window.addEventListener("keydown", (e) => {
      if (triggerStart()) return;
      if (e.code === "ArrowLeft" || e.code === "KeyA") moveLeft();
      if (e.code === "ArrowRight" || e.code === "KeyD") moveRight();
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") jump();
      if (e.code === "ArrowDown" || e.code === "KeyS") slide();
    });

    window.addEventListener("mousedown", () => triggerStart());

    function resetGame() {
      score = 0;
      coins = 0;
      speed = START_SPEED;
      player.lane = 0;
      player.targetLane = 0;
      player.x = 0;
      player.y = 0;
      player.vy = 0;
      player.isJumping = false;
      player.isSliding = false;
      player.slideTimer = 0;
      player.step = 0;

      obstacles = [];
      coinList = [];

      for (let z = 1000; z < 3600; z += 500) {
        spawnItem(z);
      }
    }

    function spawnItem(z) {
      const lane = Math.floor(Math.random() * 3) - 1;
      const r = Math.random();
      if (r < 0.45) {
        // Log hurdle (Jump)
        obstacles.push({ lane, z, type: "log" });
      } else if (r < 0.75) {
        // Flaming arch (Slide)
        obstacles.push({ lane, z, type: "fire" });
      } else {
        // Gold coins
        for (let i = 0; i < 3; i++) {
          coinList.push({ lane, z: z + i * 80, taken: false });
        }
      }
    }

    // Perspective Projection Function
    function project(x, y, z) {
      const horizonY = height * 0.35;
      const scale = 280 / Math.max(z, 1);
      return {
        x: width / 2 + x * scale,
        y: horizonY + (220 - y) * scale,
        scale: scale
      };
    }

    function update() {
      if (state !== "play") return;

      speed = Math.min(MAX_SPEED, START_SPEED + score * 0.001);
      score += speed;
      player.step += speed * 0.05;

      // Lane shift
      const targetX = player.targetLane * 90;
      player.x += (targetX - player.x) * 0.25;

      // Jump
      if (player.isJumping) {
        player.y += player.vy;
        player.vy -= 0.85;
        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.isJumping = false;
        }
      }

      // Slide
      if (player.isSliding) {
        player.slideTimer--;
        if (player.slideTimer <= 0) player.isSliding = false;
      }

      // Check Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.z -= speed;

        if (o.z < 210 && o.z > 110) {
          const sameLane = Math.abs(player.x - o.lane * 90) < 38;
          if (sameLane) {
            if (o.type === "log" && player.y < 28) {
              endGame();
              return;
            } else if (o.type === "fire" && (!player.isSliding || player.y > 8)) {
              endGame();
              return;
            }
          }
        }
        if (o.z < 20) obstacles.splice(i, 1);
      }

      // Check Coins
      for (let i = coinList.length - 1; i >= 0; i--) {
        const c = coinList[i];
        c.z -= speed;

        if (!c.taken && c.z < 210 && c.z > 110) {
          if (Math.abs(player.x - c.lane * 90) < 42) {
            c.taken = true;
            coins++;
            score += 50;
            AudioEngine.play(700, 0.08);
          }
        }
        if (c.z < 20) coinList.splice(i, 1);
      }

      // Spawn ahead
      let maxZ = 0;
      for (let i = 0; i < obstacles.length; i++) {
        if (obstacles[i].z > maxZ) maxZ = obstacles[i].z;
      }
      if (maxZ < 3200) {
        spawnItem(maxZ + 500 + Math.random() * 80);
      }
    }

    function endGame() {
      AudioEngine.play(120, 0.35);
      state = "dead";
      const finalScore = Math.floor(score / 10);
      if (finalScore > highScore) {
        highScore = finalScore;
        try { localStorage.setItem("te_high", highScore); } catch (e) {}
      }
    }

    // Draw Character Explorer
    function drawExplorer(x, y, s) {
      ctx.save();
      ctx.translate(x, y);

      // Shadow
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.beginPath();
      ctx.ellipse(0, 0, 16 * s, 6 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      const swing = Math.sin(player.step);

      if (player.isSliding) {
        // Slide pose
        ctx.fillStyle = "#8d5b2d";
        ctx.fillRect(-10 * s, -14 * s, 22 * s, 10 * s);
        // Fedora
        ctx.fillStyle = "#472c14";
        ctx.fillRect(-16 * s, -18 * s, 16 * s, 6 * s);
        // Extended leg
        ctx.strokeStyle = "#d1b48c";
        ctx.lineWidth = 4 * s;
        ctx.beginPath();
        ctx.moveTo(-4 * s, -6 * s);
        ctx.lineTo(16 * s, 0);
        ctx.stroke();
      } else if (player.isJumping) {
        // Jump pose
        ctx.fillStyle = "#8d5b2d";
        ctx.beginPath();
        ctx.arc(0, -22 * s, 10 * s, 0, Math.PI * 2);
        ctx.fill();
        // Fedora
        ctx.fillStyle = "#472c14";
        ctx.fillRect(-12 * s, -34 * s, 24 * s, 4 * s);
        ctx.fillRect(-8 * s, -40 * s, 16 * s, 6 * s);
      } else {
        // Running pose
        const hipY = -18 * s;
        const shY = -34 * s;
        const headY = -44 * s;

        // Legs
        ctx.strokeStyle = "#d1b48c";
        ctx.lineWidth = 4.5 * s;
        ctx.lineCap = "round";

        ctx.beginPath();
        ctx.moveTo(-5 * s, hipY);
        ctx.lineTo(-6 * s, hipY + 9 * s + swing * 4 * s);
        ctx.lineTo(-5 * s + swing * 5 * s, Math.min(0, hipY + 18 * s + swing * 6 * s));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(5 * s, hipY);
        ctx.lineTo(6 * s, hipY + 9 * s - swing * 4 * s);
        ctx.lineTo(5 * s - swing * 5 * s, Math.min(0, hipY + 18 * s - swing * 6 * s));
        ctx.stroke();

        // Leather Jacket Torso
        ctx.fillStyle = "#8d5b2d";
        ctx.beginPath();
        ctx.moveTo(-9 * s, shY);
        ctx.lineTo(9 * s, shY);
        ctx.lineTo(6 * s, hipY);
        ctx.lineTo(-6 * s, hipY);
        ctx.closePath();
        ctx.fill();

        // Backpack
        ctx.fillStyle = "#553216";
        ctx.fillRect(-6 * s, shY + 3 * s, 12 * s, 9 * s);

        // Head
        ctx.fillStyle = "#e3b888";
        ctx.beginPath();
        ctx.arc(0, headY, 5.5 * s, 0, Math.PI * 2);
        ctx.fill();

        // Fedora
        ctx.fillStyle = "#472c14";
        ctx.fillRect(-13 * s, headY - 2 * s, 26 * s, 3.5 * s);
        ctx.fillRect(-7 * s, headY - 9 * s, 14 * s, 7 * s);
      }

      ctx.restore();
    }

    function render() {
      // Background Sky & Jungle
      const horizonY = height * 0.35;
      ctx.fillStyle = "#261309";
      ctx.fillRect(0, 0, width, horizonY);

      // Distant Sun
      ctx.fillStyle = "#ff841f";
      ctx.beginPath();
      ctx.arc(width / 2, horizonY, 48, Math.PI, 0);
      ctx.fill();

      // Ruin chasm (floor sides)
      ctx.fillStyle = "#120803";
      ctx.fillRect(0, horizonY, width, height - horizonY);

      // Stone Path Track
      const pFarL = project(-1.5 * 90, 0, 3200);
      const pFarR = project(1.5 * 90, 0, 3200);
      const pNearL = project(-1.5 * 90, 0, 70);
      const pNearR = project(1.5 * 90, 0, 70);

      ctx.fillStyle = "#3a2d22";
      ctx.beginPath();
      ctx.moveTo(pFarL.x, pFarL.y);
      ctx.lineTo(pFarR.x, pFarR.y);
      ctx.lineTo(pNearR.x, pNearR.y);
      ctx.lineTo(pNearL.x, pNearL.y);
      ctx.closePath();
      ctx.fill();

      // Borders
      ctx.strokeStyle = "#946f48";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(pFarL.x, pFarL.y);
      ctx.lineTo(pNearL.x, pNearL.y);
      ctx.moveTo(pFarR.x, pFarR.y);
      ctx.lineTo(pNearR.x, pNearR.y);
      ctx.stroke();

      // Stone lines
      const tileSpacing = 140;
      const off = score % tileSpacing;
      for (let z = 3200; z > 70; z -= tileSpacing) {
        const curZ = z - off;
        if (curZ <= 70) continue;
        const l = project(-1.5 * 90, 0, curZ);
        const r = project(1.5 * 90, 0, curZ);
        ctx.strokeStyle = "rgba(18, 12, 6, 0.5)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y);
        ctx.lineTo(r.x, r.y);
        ctx.stroke();
      }

      // Draw items (obstacles + coins)
      const allItems = [
        ...obstacles.map(o => ({ ...o, isCoin: false })),
        ...coinList.filter(c => !c.taken).map(c => ({ ...c, isCoin: true }))
      ].sort((a, b) => b.z - a.z);

      for (let i = 0; i < allItems.length; i++) {
        const it = allItems[i];
        const xPos = it.lane * 90;

        if (it.isCoin) {
          const p = project(xPos, 22, it.z);
          ctx.fillStyle = "#ffcc00";
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(2, 10 * p.scale), 0, Math.PI * 2);
          ctx.fill();
        } else {
          const p = project(xPos, 0, it.z);
          const w = 68 * p.scale;

          if (it.type === "log") {
            const h = 34 * p.scale;
            ctx.fillStyle = "#5c3418";
            ctx.fillRect(p.x - w / 2, p.y - h, w, h);
            ctx.fillStyle = "#e03e1b";
            ctx.fillRect(p.x - w / 2, p.y - h, w, 4 * p.scale);
          } else {
            const h = 64 * p.scale;
            ctx.fillStyle = "#3b2c21";
            ctx.fillRect(p.x - w / 2, p.y - h, w, 12 * p.scale); // Top arch
            ctx.fillRect(p.x - w / 2, p.y - h, 6 * p.scale, h);    // Left pillar
            ctx.fillRect(p.x + w / 2 - 6 * p.scale, p.y - h, 6 * p.scale, h); // Right pillar
            ctx.fillStyle = "#ff5500";
            ctx.fillRect(p.x - w / 2 + 5 * p.scale, p.y - h + 10 * p.scale, w - 10 * p.scale, 8 * p.scale); // Fire
          }
        }
      }

      // Draw Explorer at camera depth Z=140
      const pPlayer = project(player.x, player.y, 140);
      drawExplorer(pPlayer.x, pPlayer.y, pPlayer.scale);

      // HUD Text
      if (state === "play") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText(`${Math.floor(score / 10)}m`, 20, 36);

        ctx.fillStyle = "#ffc107";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(`Coins: ${coins}`, 20, 60);
      } else if (state === "menu") {
        ctx.fillStyle = "#ffb03b";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("TEMPLE ESCAPE", width / 2, height * 0.28);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px sans-serif";
        ctx.fillText("USE BUTTONS OR SWIPE TO MOVE", width / 2, height * 0.34);

        ctx.fillStyle = "#22c55e";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("▶ TAP TO START", width / 2, height * 0.42);
      } else if (state === "dead") {
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 32px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", width / 2, height * 0.28);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(`Distance: ${Math.floor(score / 10)}m | Coins: ${coins}`, width / 2, height * 0.34);
        ctx.fillText(`Best: ${highScore}m`, width / 2, height * 0.39);

        ctx.fillStyle = "#ffb03b";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("TAP TO RETRY", width / 2, height * 0.46);
      }

      update();
      requestAnimationFrame(render);
    }

    // Initialize and loop immediately
    resetGame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
